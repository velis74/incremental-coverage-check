name: Coverage check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # commit comments on pushes; pull requests use the line below
  pull-requests: write

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Incremental coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          # The check needs the base branch to diff against.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        # The pip upgrade is not cosmetic: the project metadata is PEP 639, which
        # older pip - as shipped with the 3.9 runner - refuses to read.
        # Editable, so coverage measures the working tree rather than a copy of it
        # in site-packages.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the test suite under coverage
        run: |
          coverage run -m unittest discover -s test -t .   # source is set in pyproject.toml
          coverage report -m
          coverage json

      # Dogfooding: this runs the working tree's version of the action, not a
      # published tag, so a change is checked by the code it is changing.
      - name: Incremental coverage check
        if: matrix.python-version == '3.12'
        uses: ./
        with:
          coverage-files: coverage.json
          threshold: "80"
