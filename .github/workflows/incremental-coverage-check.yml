name: Coverage check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # commit comments on pushes; pull requests use the line below
  pull-requests: write

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Incremental coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          # The check needs the base branch to diff against.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --locked

      - name: Run the test suite under coverage
        run: |
          uv run coverage run -m unittest discover -s test -t .   # source is set in pyproject.toml
          uv run coverage report -m
          uv run coverage json

      # Dogfooding: this runs the working tree's version of the action, not a
      # published tag, so a change is checked by the code it is changing.
      - name: Incremental coverage check
        if: matrix.python-version == '3.12'
        uses: ./
        with:
          coverage-files: coverage.json
          threshold: "80"

  # the required status check: fails when any other job of this workflow failed or was cancelled
  all-green:
    name: all-green (incremental-coverage-check)
    if: always()
    needs: [coverage]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
