[project]
name = "incremental-coverage-check"
description = "Fail a pull request when the lines it changes are not covered by tests."
readme = "README.md"
authors = [{ name = "Jure Erznožnik", email = "jure.erznoznik@velis.si" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
# Same as incremental_coverage.__version__ (test_entrypoints checks they match).
version = "3.1.0"

# No runtime dependencies on purpose. Everything the check needs - argparse, json,
# xml.etree, urllib - is in the standard library, so action.yml can run it straight
# off a bare runner without a pip install step.
dependencies = []

[project.urls]
Homepage = "https://github.com/velis74/incremental-coverage-check"
Repository = "https://github.com/velis74/incremental-coverage-check"
Issues = "https://github.com/velis74/incremental-coverage-check/issues"
Documentation = "https://docs.velis.si/incremental-coverage-check.html"

[dependency-groups]
# ruff is pinned to the version the code is formatted with; bump it together with a `ruff format .` pass.
# coverage 7.11 dropped Python 3.9, so the 3.9 leg of the test matrix gets the last release that runs there.
dev = [
    "coverage[toml]==7.15.4; python_version >= '3.10'",
    "coverage[toml]==7.10.7; python_version < '3.10'",
    "ruff==0.3.0",
]

[tool.uv]
# GitHub runs the action straight from the repository (action.yml calls main.py): nothing is built or installed.
package = false

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [
    ".git",
    ".idea",
    ".pytest_cache",
    ".ruff_cache",
    ".vscode",
    "build",
    "dist",
    "test/resources",
]

[tool.ruff.lint]
# Pyflakes, pycodestyle, isort, bugbear, comprehensions, pyupgrade.
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = [
    # `from __future__ import annotations` is deliberate: the action must run on
    # whatever Python the runner happens to provide, down to 3.9.
    "UP006",
    "UP007",
    "UP035",
]

fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
case-sensitive = false
lines-between-types = 1
combine-as-imports = true
order-by-type = false

[tool.coverage.run]
# main.py is what action.yml actually executes, so it is measured too.
source = ["incremental_coverage", "main"]
branch = false

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
